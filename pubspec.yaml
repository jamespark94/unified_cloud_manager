name: unified_cloud_manager
description: "A lightweight, unified cloud storage manager focused strictly on file operations across multiple cloud storage providers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Background & Notification
  flutter_foreground_task: ^8.17.0

  # SQLite Database & Storage
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # Networking & HTTP
  dio: ^5.8.0+1
  http: ^1.3.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.1
  xml: ^6.5.0

  # Cryptography & System
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  permission_handler: ^11.3.1
  file_picker: ^13.3.3
  intl: ^0.20.2
  uuid: ^4.5.1
  desktop_drop: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
